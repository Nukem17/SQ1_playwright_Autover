name: Autoverzekering — dagelijkse funnel

on:
  schedule:
    # Expliciet UTC; de planning-job selecteert zomer- of wintertijd.
    - cron: '45 11 * * *'
    - cron: '45 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoverzekering-funnel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  planning:
    name: Nederlandse tijd controleren
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.schedule.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Geplande tijd controleren
        id: schedule
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: node scripts/funnel-schedule.mjs >> "$GITHUB_OUTPUT"

  funnel:
    needs: planning
    if: ${{ needs.planning.outputs.run == 'true' }}
    name: Klantreis in Chromium, Firefox en WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Project ophalen
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Funnel uitvoeren met lintcontrole
        run: bash scripts/run-lancyr-browsers.sh funnel standaard all

      - name: Samenvatting tonen
        if: ${{ always() }}
        shell: bash
        run: |
          shopt -s nullglob
          summaries=(test-runs/*/SAMENVATTING.md)
          if (( ${#summaries[@]} )); then
            for summary in "${summaries[@]}"; do
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo 'Geen samenvatting beschikbaar. Bekijk de logs voor een build- of voorbereidingsfout.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapporten, screenshots en traces bewaren
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: autoverzekering-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-runs/
          if-no-files-found: warn
          retention-days: 7
