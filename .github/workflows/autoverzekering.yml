name: Autoverzekering — dagelijkse funnel

on:
  schedule:
    # Dagelijks 02:00 UTC: 03:00 Nederlandse wintertijd, 04:00 zomertijd.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoverzekering-funnel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  funnel:
    name: Klantreis in Chromium, Firefox en WebKit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - name: Project ophalen
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Funnel uitvoeren met lintcontrole
        run: bash scripts/run-lancyr-browsers.sh funnel standaard all

      - name: Samenvatting tonen
        if: ${{ always() }}
        shell: bash
        run: |
          shopt -s nullglob
          summaries=(test-runs/*/SAMENVATTING.md)
          if (( ${#summaries[@]} )); then
            for summary in "${summaries[@]}"; do
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo 'Geen samenvatting beschikbaar. Bekijk de logs voor een build- of voorbereidingsfout.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rapporten, screenshots en traces bewaren
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: autoverzekering-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-runs/
          if-no-files-found: warn
          retention-days: 7
